name: AI 日报推送

on:
  schedule:
    # 每天北京时间 10:00 (UTC+8 = 02:00 UTC)
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cross-run repo memory: first_seen / one-push-per-repo / star history.
      # Without this cache the runner forgets every push each day and the same
      # repos (stablyai/orca...) get re-pushed daily. Static restore prefix +
      # unique save key (run-scoped) = the documented "always update cache"
      # pattern; save runs even if the digest step failed so observation
      # data from the fetch stage is never lost.
      - name: 恢复 repo 记忆库
        uses: actions/cache@v4
        with:
          path: |
            var/repo-memory.db
            var/repo-memory-group.db
          key: repo-memory-v1-${{ github.run_id }}
          restore-keys: |
            repo-memory-v1

      - name: 推送日报到飞书群
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          NEXUSNEWS_LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m nexusnews --config config.group.json

      - name: 保存 repo 记忆库
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            var/repo-memory.db
            var/repo-memory-group.db
          key: repo-memory-v1-${{ github.run_id }}-${{ github.run_attempt }}
